<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>הדרך הביתה - Michal's Trust Path</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f8ff; color: #333; text-align: center; padding: 20px; line-height: 1.6; }
        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 20px; max-width: 450px; margin-left: auto; margin-right: auto; }
        h1 { color: #2c3e50; font-size: 1.8rem; margin-bottom: 10px; }
        .balance-amount { font-size: 2.5rem; font-weight: bold; color: #2ecc71; display: block; margin: 10px 0; }
        .progress-container { background: #ecf0f1; border-radius: 15px; height: 25px; width: 100%; margin: 20px 0; overflow: hidden; border: 1px solid #dcdde1; }
        .progress-bar { background: linear-gradient(90deg, #2ecc71, #27ae60); height: 100%; width: 0%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; }
        button { background: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        .admin-btn { background: #95a5a6; font-size: 12px; margin-top: 30px; width: auto; padding: 5px 15px; }
        .penalty-btn { background: #e74c3c; font-size: 14px; }
        .bonus-btn { background: #27ae60; font-weight: bold; margin-bottom: 20px; }
        .task-item { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 15px; border-radius: 10px; margin-bottom: 10px; text-align: right; border-right: 5px solid #3498db; }
        .approve-btn { background: #2ecc71; width: auto; margin: 0; padding: 8px 15px; }
        .admin-section { display: none; margin-top: 20px; border-top: 2px dashed #bdc3c7; padding-top: 20px; }
        .penalty-list-item { border-right: 5px solid #e74c3c; background: #fff5f5; }
    </style>
</head>
<body>

    <div class="card">
        <h1>הדרך הביתה 🏠</h1>
        <span style="color: #7f8c8d;">יתרה לתיקון</span>
        <span id="balance" class="balance-amount">$345</span>
        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        <p id="progressText" style="font-weight: bold; color: #34495e;">טוען נתונים...</p>
    </div>

    <div class="card" id="userView">
        <h3>דווח על משימה שבוצעה</h3>
        <select id="taskSelect">
            <option value="10">קיפול כביסה ($10)</option>
            <option value="5">פיזור כביסה בארונות ($5)</option>
            <option value="7">פינוי/טעינת מדיח ($7)</option>
            <option value="15">ארגון מקלחת ($15)</option>
            <option value="12">שאיבת סלון ($12)</option>
            <option value="8">שאיבת מטבח ($8)</option>
        </select>
        <button onclick="submitTask()">שלחי לאישור הורים</button>
    </div>

    <button onclick="toggleAdmin()" class="admin-btn">Security Gate (הורים)</button>

    <div id="adminView" class="admin-section card">
        <h3 style="color: #e67e22;">ניהול משמעת ואמון</h3>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
            <button onclick="quickPenalty('הברזה (Y)', 20)" class="penalty-btn">הברזה ($20)</button>
            <button onclick="quickPenalty('שקר מפורש', 30)" class="penalty-btn">שקר ($30)</button>
        </div>
        
        <button onclick="applyBonus('בונוס יושרה (דיווח עצמי)', 10)" class="bonus-btn">⭐ בונוס יושרה ואמת ($10)</button>
        
        <div id="pendingList"></div>
    </div>
