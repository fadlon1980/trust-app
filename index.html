<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הדרך הביתה - מד אמון</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: system-ui, sans-serif; background: #f0f8ff; color: #333; text-align: center; padding: 20px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .progress-container { background: #eee; border-radius: 20px; height: 30px; width: 100%; margin: 20px 0; overflow: hidden; }
        .progress-bar { background: #4caf50; height: 100%; width: 0%; transition: width 0.5s; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .task-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
        .pending { color: #ffa500; font-size: 0.8em; }
        .admin-section { display: none; border-top: 2px solid #007bff; margin-top: 30px; padding-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>הדרך הביתה 🏠</h1>
        <p>יתרה לתיקון: <span id="balance">$345</span></p>
        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        <p id="progressText">0/23 בלוקים הושלמו</p>
    </div>

    <div class="card" id="userView">
        <h3>דווח על ביצוע משימה</h3>
        <select id="taskSelect">
            <option value="10">קיפול כביסה ($10)</option>
            <option value="7">פינוי מדיח ($7)</option>
            <option value="15">ארגון מקלחת ($15)</option>
            <option value="12">שאיבת סלון ($12)</option>
        </select>
        <button onclick="submitTask()">שלחי לאישור</button>
    </div>

    <button onclick="toggleAdmin()">כניסת הורים (Security Gate)</button>

    <div id="adminView" class="admin-section card">
        <h3>אישור משימות (ממתינות)</h3>
        <div id="pendingList"></div>
    </div>

    <script>
        let totalDebt = 345;
        let approvedAmount = 0;
        let pendingTasks = JSON.parse(localStorage.getItem('pendingTasks')) || [];
        let approvedTasks = JSON.parse(localStorage.getItem('approvedTasks')) || [];

        function updateUI() {
            approvedAmount = approvedTasks.reduce((sum, t) => sum + t.value, 0);
            const currentBalance = totalDebt - approvedAmount;
            const progressPercent = (approvedAmount / totalDebt) * 100;
            const blocks = Math.floor(approvedAmount / 15);

            document.getElementById('balance').innerText = `$${currentBalance}`;
            document.getElementById('progressBar').style.width = `${progressPercent}%`;
            document.getElementById('progressText').innerText = `${blocks}/23 בלוקים הושלמו`;

            // Update Admin List
            const list = document.getElementById('pendingList');
            list.innerHTML = '';
            pendingTasks.forEach((task, index) => {
                list.innerHTML += `
                    <div class="task-item">
                        <span>${task.name} ($${task.value})</span>
                        <button style="background:green" onclick="approveTask(${index})">אשר</button>
                    </div>`;
            });
            
            localStorage.setItem('pendingTasks', JSON.stringify(pendingTasks));
            localStorage.setItem('approvedTasks', JSON.stringify(approvedTasks));
        }

        function submitTask() {
            const select = document.getElementById('taskSelect');
            const taskName = select.options[select.selectedIndex].text;
            const taskValue = parseInt(select.value);
            
            pendingTasks.push({ name: taskName, value: taskValue });
            alert("המשימה נשלחה לאישור ההורים");
            updateUI();
        }

        function toggleAdmin() {
            const pass = prompt("הכנס סיסמת הורה:");
            if (pass === "1234") { // Change this to your private password
                document.getElementById('adminView').style.display = 'block';
            } else {
                alert("סיסמה שגויה");
            }
        }

        function approveTask(index) {
            const task = pendingTasks.splice(index, 1)[0];
            approvedTasks.push(task);
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
